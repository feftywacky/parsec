[package]
name = "parsec_rs"
version = "0.1.0"
edition = "2021"

[lib]
# "rlib" added alongside "staticlib" so `cargo test --test signing_vectors` (rust/tests/)
# has something to link against; cargo cannot build integration tests for a
# staticlib-only crate. Does not change what gets linked into the C++ binary — Corrosion
# still only asks for CRATE_TYPES staticlib (04 §5.4).
crate-type = ["staticlib", "rlib"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
crossbeam-queue = "0.3"
futures-util = "0.3"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "http2"] }
rmp-serde = "1.3"
# Explicit, matching the crypto backend tokio-tungstenite's rustls pulls in (both must
# agree on ring vs aws-lc-rs, and rustls itself ships with NO default provider — see
# ffi/mod.rs's `install_default()` call, item 1 of this crate's TLS fix).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
