[package]
name = "minsign"
version = "0.1.0"
edition = "2021"

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = { version = "0.10", default-features = false }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
serde_json = "1"
